# EC2에서 쓰는 실행용 compose (이미지는 GitHub Actions가 빌드해서 Docker Hub에 올림)
services:
    app:
        image: ${IMAGE}
        container_name: capstone
        restart: always
        env_file: .env
        # AI 서버는 같은 compose 네트워크의 ai 컨테이너 (.env의 AI_SERVER_URL보다 이 값이 우선)
        environment:
            AI_SERVER_URL: http://ai:8000
        depends_on:
            - ai
        # Node가 PID 1이면 끝난 Chromium 자식 프로세스(좀비)를 정리하지 못해서 tini를 init으로 둔다
        init: true
        # Chromium은 /dev/shm을 많이 쓴다 (Docker 기본 64MB면 긴 대화에서 탭이 죽음)
        shm_size: "512m"
        # 로그 파일을 EC2 디스크에 남겨서 재배포해도 유지 (컨테이너 안 node 사용자 = uid 1000)
        volumes:
            - /var/log/backend:/var/log/backend
        # Nginx(EC2에 설치)가 80번으로 받아서 localhost:3000으로 넘겨 줌
        # 127.0.0.1로 묶어서 외부에서 3000번으로 직접 들어오는 건 막음
        ports:
            - "127.0.0.1:3000:3000"
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"

    # AI 서버 (ai/ 폴더, FastAPI). 포트를 밖으로 열지 않고 app 컨테이너만 http://ai:8000 으로 부른다
    ai:
        image: ${AI_IMAGE}
        container_name: capstone-ai
        restart: always
        # OPENAI_API_KEY·INTERNAL_API_KEY(백엔드 .env와 같은 값)·AI_MODEL·AI_ENABLE_V2_ANALYSES=true·AI_ENABLE_SEARCH=true
        # 백엔드 .env와 나눠서 DB·JWT 비밀값이 AI 컨테이너에 들어가지 않게 한다
        env_file: ai.env
        environment:
            AI_DATA_DIR: /data
        # 모델 호출 기록·결과·검색 색인 SQLite(/data/knowledge_search) (컨테이너 안 ai 사용자 = uid 1000). 재배포해도 남아서 같은 요청은 결과를 다시 씀
        volumes:
            - /var/lib/capstone-ai:/data
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"

    # ChatGPT 커넥터용 MCP 서버 (collector/mcp_server.py)
    # 백엔드와 같은 이미지를 쓰고 실행 명령만 다르다 (Python·Playwright·Chromium·수집 모듈이 이미 들어 있음)
    mcp:
        image: ${IMAGE}
        container_name: capstone-mcp
        restart: always
        env_file: .env # MCP_JWT_SECRET, MCP_PUBLIC_URL을 같이 쓴다
        environment:
            # 같은 compose 네트워크 안에서 백엔드 컨테이너를 서비스 이름(app)으로 부른다
            BACKEND_INTERNAL_URL: http://app:3000
        init: true
        shm_size: "512m"
        working_dir: /app/collector
        command: ["python3", "mcp_server.py"]
        # Nginx가 /mcp, /.well-known/oauth-protected-resource를 localhost:8000으로 넘겨 줌
        # (AI 서버도 컨테이너 안에서는 8000번이지만 밖으로 열지 않아서 겹치지 않는다)
        ports:
            - "127.0.0.1:8000:8000"
        depends_on:
            - app
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"
